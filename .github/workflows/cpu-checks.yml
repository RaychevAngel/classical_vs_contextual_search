name: CPU checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  arithmetic-and-search-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q utils evaluate generate_data train _scripts_mcts _scripts_sos
